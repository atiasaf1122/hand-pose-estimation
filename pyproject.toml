[project]
name = "hand-pose-estimation"
version = "0.1.0"
description = "YOLOv26 Hand Keypoint Detection and Tracking Lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "wandb>=0.16.0",
    "python-dotenv>=1.0.0",
    "opencv-python>=4.8.0",
    "albumentations>=2.0.8",
]

[tool.uv]
package = false

# CUDA builds of torch for the local RTX 3090s (PyPI ships CPU-only on Windows).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=2.3.3",
]
